[project]
name = "annotated-transformer-modern"
version = "0.1.0"
description = "The Annotated Transformer(harvardnlp)를 2026년 라이브러리 버전에서 그대로 돌아가게 고친 것"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 원본 고정: torch==1.11.0+cu113 — Python 3.10까지만 휠이 있다.
    "torch>=2.6",
    # 원본 고정: torchtext==0.12, torchdata==0.3.0 — 개발 중단. torchtext_compat.py가 대신한다.
    # Multi30k는 HF Hub(bentrevett/multi30k)에서 받는다.
    "datasets",
    # 원본 고정: spacy==3.2
    "spacy>=3.8",
    # 원본은 노트북 안에서 `python -m spacy download`로 받는데, uv가 만든 가상환경에는 pip이 없어 실패한다.
    # 모델 휠을 의존성으로 직접 건다.
    "de-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # 원본 고정: altair==4.1, pandas==1.3.5
    "altair>=5",
    "pandas",
    "GPUtil",
    # 원본 고정: jupytext==1.13
    "jupytext",
    "nbconvert",
    "ipykernel",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
